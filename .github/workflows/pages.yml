name: Deploy site

# Builds the dashboard and serves it with the race bundles from the `data`
# branch. The bundles are built locally and pushed by `python -m
# pitwall.publish`, which also triggers this workflow: F1's live-timing
# archive refuses requests from cloud hosts, so Actions cannot fetch them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out race bundles
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard
        working-directory: frontend
        env:
          VITE_DATA_BASE: ./data
        run: |
          npm ci
          npm run build
          rm -rf ../data/.git ../data/README.md
          cp -r ../data dist/data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

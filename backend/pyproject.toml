[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "2.0.0"
description = "Race engineering analysis for real Formula 1 sessions"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastf1>=3.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pitwall-export = "pitwall.export:main"

[tool.setuptools.packages.find]
include = ["pitwall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live access to the F1 data sources"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
